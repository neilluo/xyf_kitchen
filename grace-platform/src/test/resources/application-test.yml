spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

grace:
  encryption:
    master-key: dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3OA==
  storage:
    video-dir: ${java.io.tmpdir}/grace-test/videos
    temp-dir: ${java.io.tmpdir}/grace-test/temp
    avatar-dir: ${java.io.tmpdir}/grace-test/avatars
  llm:
    api-key: test-dummy-key
  youtube:
    client-id: test
    client-secret: test
    redirect-uri: http://localhost:8000/api/distribution/auth/youtube/callback
  opencrawl:
    api-key: test
  oss:
    endpoint: test
    bucket: test
    access-key-id: test
    access-key-secret: test
