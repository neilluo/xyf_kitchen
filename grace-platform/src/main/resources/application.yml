spring:
  application:
    name: grace-platform

  datasource:
    url: jdbc:mysql://rm-2ze54x34bt9597z4ryo.mysql.rds.aliyuncs.com:3306/xyfkitchen?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: neilluo1220
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: GraceHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.grace.platform.shared
  type-handlers-package: com.grace.platform.shared.infrastructure.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

grace:
  encryption:
    master-key: ${GRACE_ENCRYPTION_KEY}

  oss:
    endpoint: ${OSS_ENDPOINT}
    bucket: ${OSS_BUCKET}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}

  storage:
    video-dir: ${GRACE_VIDEO_DIR:./data/videos}
    temp-dir: ${GRACE_TEMP_DIR:./data/temp}
    avatar-dir: ${GRACE_AVATAR_DIR:./data/avatars}

  upload:
    chunk-size: 16777216
    session-ttl: 86400
    max-file-size: 5368709120

  llm:
    provider: qwen
    api-key: ${QWEN_API_KEY}
    model: qwen3.6-plus
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    max-tokens: 2048
    temperature: 0
    retry:
      max-attempts: 3
      backoff-multiplier: 2

  youtube:
    client-id: ${YOUTUBE_CLIENT_ID}
    client-secret: ${YOUTUBE_CLIENT_SECRET}
    redirect-uri: ${YOUTUBE_REDIRECT_URI:http://localhost:8000/api/distribution/auth/youtube/callback}
    scopes: https://www.googleapis.com/auth/youtube.upload,https://www.googleapis.com/auth/youtube.readonly

  opencrawl:
    base-url: ${OPENCRAWL_BASE_URL:https://api.opencrawl.io/v1}
    api-key: ${OPENCRAWL_API_KEY}
    timeout: 30000

  scheduler:
    quota-retry:
      fixed-delay: 1800000
      max-retries: 5

  upload-task:
    executor:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 50
    pull:
      scan-interval-ms: 30000
      orphan-threshold-s: 60
      zombie-threshold-s: 120
    max-attempts: 5
    instance-id: ${HOSTNAME:local}

server:
  port: ${SERVER_PORT:8000}

# EagleEye 风格日志配置（对应 logback-spring.xml 中的 springProperty）
grace-platform:
  log:
    path: ${GRACE_LOG_PATH:./logs/grace-platform}
    max-file-size: 100MB
    max-history-days: 7
    total-size-cap: 2GB

logging:
  level:
    com.grace.platform: DEBUG
